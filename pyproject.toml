[project]
name = "cognisync-professional"
version = "0.2.0"
description = "Background-first professional agent for evidence-backed project intelligence, bounded autonomy and human decision gates."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Andrzej Mikulski" }]
dependencies = [
  "strands-agents>=1.0.0",
]

[project.optional-dependencies]
aws = [
  "boto3>=1.40.0",
  "bedrock-agentcore>=0.1.0",
]
evals = [
  "strands-agents-evals>=1.0.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.13",
]

[project.scripts]
cognisync = "cognisync.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
